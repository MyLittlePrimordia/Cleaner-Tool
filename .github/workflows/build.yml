name: Build Windows Executable

# Build a standalone .exe on every push to main / PR / manual run, and
# continuously overwrite a rolling "latest" release with the raw .exe
# (no zip). Version tags (e.g. v2.1.0) still create their own release too.
#
# Asset name is pinned to Cleaner-Tool.exe on purpose: app/update_checker.py
# only recognises a release asset named exactly "Cleaner-Tool.exe", so the
# in-app "Update Available" flow reads this build.
#
# Defender / SmartScreen notes (DEF-001):
#   - Every build embeds a full VERSIONINFO resource (version_info.txt:
#     CompanyName, ProductName, FileVersion, etc.), which removes one of the
#     heuristic signals behind "Behavior:Win32/Persistence.A!ml".
#   - Code signing is the single highest-leverage remaining fix. The
#     "Sign the executable" step below is ready and runs only when you
#     upload the two secrets listed in its comments. Until then the build
#     is unsigned, but already carries proper version metadata.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build .exe
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run the regression suite
        run: python -m pytest -q

      # Undefined-name check. F821 is deliberately the only selector: the
      # codebase has many intentional best-effort imports/locals that other
      # pyflakes rules flag, but an undefined name is always a runtime bug.
      # Three shipped in v1 (all_priority/all_selected class errors) and were
      # invisible because the handlers around them swallow exceptions.
      - name: Static check (undefined names)
        run: python -m ruff check app --select F821

      - name: SEC-001 allowlist drift guard
        run: python tools/verify_sec001_task_allowlist.py

      - name: Build with PyInstaller
        # --onefile    : single portable .exe
        # --windowed   : no console window behind the GUI
        # --name       : Cleaner-Tool -> dist\Cleaner-Tool.exe (matches the
        #                asset name app/update_checker.py looks for)
        # --manifest   : embed asInvoker manifest — the app starts unelevated
        #                and uses its in-app Admin Gate / restart handshake to
        #                elevate only when needed (cleanups work without admin)
        # --add-data   : bundle app/assets -> <_MEIPASS>/app/assets, which is
        #                the first layout app.utils.resolve_asset_path probes
        # --icon/--version-file : colored 🧼 icon + Win32 VERSIONINFO
        run: >
          pyinstaller --onefile --windowed
          --name "Cleaner-Tool"
          --icon "app/assets/icon.ico"
          --add-data "app/assets;app/assets"
          --manifest "app/assets/app_manifest.xml"
          --version-file "version_info.txt"
          app/__main__.py

      # ------------------------------------------------------------------
      # Optional Authenticode signing (DEF-001 highest-leverage fix)
      # ------------------------------------------------------------------
      # This step is SKIPPED automatically until you add the two secrets
      # below. Once the secrets exist, every future build is signed with
      # no further action from you.
      #
      # How to enable (one-time):
      #   1. Buy a code-signing certificate (OV or EV). EV is stronger
      #      against SmartScreen but more expensive.
      #   2. Export the cert as a .pfx (PKCS#12) protected by a password.
      #   3. In the GitHub repo -> Settings -> Secrets and variables -> Actions
      #      create two repository secrets:
      #        CODE_SIGNING_PFX_BASE64   = base64 of the entire .pfx file
      #                                   (PowerShell: [Convert]::ToBase64String(
      #                                      [IO.File]::ReadAllBytes("cert.pfx")))
      #        CODE_SIGNING_PASSWORD     = the password you set on the .pfx
      #   4. Push any change. The next build will be signed.
      #
      # After the first signed build, also submit the .exe once to
      # https://www.microsoft.com/wdsi/filesubmission so Microsoft's
      # reputation system learns the new signature faster.
      - name: Sign the executable (Authenticode)
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrEmpty($env:CODE_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrEmpty($env:CODE_SIGNING_PASSWORD)) {
            Write-Host "No code-signing secrets found — skipping Authenticode signing."
            Write-Host "(Add CODE_SIGNING_PFX_BASE64 + CODE_SIGNING_PASSWORD to enable.)"
            exit 0
          }

          Write-Host "Signing Cleaner-Tool.exe …"

          $pfxBytes = [Convert]::FromBase64String($env:CODE_SIGNING_PFX_BASE64)
          $pfxPath  = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          # Prefer the modern Windows SDK signtool if present, otherwise fall
          # back to the one that ships with the Visual Studio build tools.
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $signtool) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe",
              "${env:ProgramFiles}\Windows Kits\10\bin\*\x64\signtool.exe"
            )
            $found = Get-ChildItem -Path $candidates -ErrorAction SilentlyContinue |
                     Sort-Object FullName -Descending |
                     Select-Object -First 1
            if ($found) { $signtool = $found.FullName }
          }
          if (-not $signtool) {
            throw "signtool.exe not found on the runner. Cannot sign."
          }

          & $signtool sign `
            /f $pfxPath `
            /p $env:CODE_SIGNING_PASSWORD `
            /fd sha256 `
            /tr http://timestamp.digicert.com `
            /td sha256 `
            /v `
            "dist\Cleaner-Tool.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed with exit code $LASTEXITCODE"
          }
          Write-Host "Signing completed successfully."

          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue

      - name: Compute SHA-256 checksum
        # Published next to the .exe so a downloader can verify it. The
        # in-app update checker prefers a .sha256 asset (see update_checker.py,
        # "prefer publishing a .sha256 asset long-term").
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist\Cleaner-Tool.exe").Hash.ToLower()
          "$hash  Cleaner-Tool.exe" | Out-File -Encoding ascii "dist\Cleaner-Tool.exe.sha256"
          Write-Host "SHA256: $hash"

      - name: Upload build artifact (raw .exe, no zip)
        uses: actions/upload-artifact@v4
        with:
          name: Cleaner-Tool-windows-exe
          path: |
            dist/Cleaner-Tool.exe
            dist/Cleaner-Tool.exe.sha256
          if-no-files-found: error

      - name: Update rolling latest release (overwrite every build)
        # Only on pushes to main — PRs from forks can't write releases, and we
        # don't want feature branches clobbering "latest". Creates/overwrites
        # the `latest` tag and replaces the attached Cleaner-Tool.exe with the
        # freshly built one.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Rolling build of Cleaner-Tool.exe from the latest `main` commit.

            - Commit: ${{ github.sha }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download `Cleaner-Tool.exe` below (raw .exe, not zipped). This
            asset is overwritten on every push to `main`. Verify it against
            `Cleaner-Tool.exe.sha256`.
          files: |
            dist/Cleaner-Tool.exe
            dist/Cleaner-Tool.exe.sha256
          make_latest: "true"
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Cleaner-Tool.exe
            dist/Cleaner-Tool.exe.sha256
          generate_release_notes: true
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
