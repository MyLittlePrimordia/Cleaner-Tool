name: Build Windows Executable

# Build a standalone .exe on every push to main / PR / manual run, and
# continuously overwrite a rolling "latest" release with the raw .exe
# (no zip). Version tags (e.g. v2.1.0) still create their own release too.
#
# Asset name is pinned to Cleaner-Tool.exe on purpose: app/update_checker.py
# only recognises a release asset named exactly "Cleaner-Tool.exe", so the
# in-app "Update Available" flow reads this build.
#
# Defender / SmartScreen notes (DEF-001):
#   - Every build embeds a full VERSIONINFO resource (.github/version_info.txt:
#     CompanyName, ProductName, FileVersion, etc.), which removes one of the
#     heuristic signals behind "Behavior:Win32/Persistence.A!ml".
#   - Code signing is the single highest-leverage remaining fix, and it is
#     wired to SSL.com eSigner (cloud HSM) below. It runs only when the four
#     secrets listed in that step exist; until then the build is unsigned but
#     already carries proper version metadata.
#   - The signing step is gated on push/workflow_dispatch, never on
#     pull_request: a fork PR gets no secrets anyway, and a same-repo PR should
#     not spend a signature or hand signing credentials to reviewable code.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build .exe
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements.txt
          pip install -r .github/requirements-dev.txt

      # Static check: the whole `F` (pyflakes) set, not just F821. Every
      # finding here is a real defect class - an undefined or unused name, a
      # redefinition, a wildcard import, a `return` outside a function - and
      # three undefined names shipped in v1 because the handlers around them
      # swallow exceptions. app/ is at zero now, so any new finding fails the
      # build.
      - name: Static check (pyflakes defects)
        run: python -m ruff check app --select F

      # Design-literal gate: a new widget that writes `padx=9`, `radius=16`,
      # an icon size or a hand-written font tuple gets told which theme token
      # to reach for, for every finding at once.
      - name: Design-literal gate
        run: python .github/tools/design_literals.py

      # SEC-001 allowlist drift guard: recomputes the measured tweak totals
      # from the app/tasks/tweak_common.py source on every build.
      - name: SEC-001 allowlist drift guard
        run: python .github/tools/verify_sec001_task_allowlist.py

      # R-008: every PowerShell call site must go through app/powershell.py.
      # The guard walks the AST, so a new list, a new shell string or a bare
      # exe handed to ShellExecuteW all fail the build.
      - name: PowerShell single call-site guard
        run: python .github/tools/verify_powershell_single_call_site.py

      # Dry-run promise: Storage Insight, the Health junk sensor and the
      # Low-Space nudge estimate sizes by CALLING the real Clean-tab tasks
      # with dry_run=True. The guard walks what each allowlisted task can
      # reach and fails on a mutation no dry check dominates.
      - name: Dry-run scope guard
        run: python .github/tools/verify_dryrun_scope.py

      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile --windowed
          --name "Cleaner-Tool"
          --icon "app/assets/icon.ico"
          --add-data "app/assets;app/assets"
          --manifest "app/assets/app_manifest.xml"
          --version-file ".github/version_info.txt"
          app/__main__.py

      # Authenticode signing via SSL.com eSigner (cloud HSM). To enable,
      # create these four repository secrets
      # (Settings -> Secrets and variables -> Actions):
      #   ES_USERNAME      SSL.com account username
      #   ES_PASSWORD      SSL.com account password
      #   ES_CREDENTIAL_ID eSigner credential id
      #   ES_TOTP_SECRET   the base32 seed behind the eSigner OTP
      - name: Check for signing credentials
        id: creds
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
        run: |
          $present = -not [string]::IsNullOrEmpty($env:ES_USERNAME)
          "available=$($present.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($present) { Write-Host "Signing credentials found." }
          else { Write-Host "No signing credentials: the artifact will be unsigned." }

      - name: Sign the executable (SSL.com eSigner)
        id: sign
        if: >-
          steps.creds.outputs.available == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: sslcom/esigner-codesign@b7f8ff36fc0de8690fbbab8e5b4421d29802f747
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/dist/Cleaner-Tool.exe
          override: true

      - name: Verify the signature
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sig = Get-AuthenticodeSignature "dist\Cleaner-Tool.exe"
          Write-Host ("Status      : " + $sig.Status)
          Write-Host ("StatusText  : " + $sig.StatusMessage)
          if ($sig.SignerCertificate) {
            Write-Host ("Signed by   : " + $sig.SignerCertificate.Subject)
            Write-Host ("Thumbprint  : " + $sig.SignerCertificate.Thumbprint)
          }
          if (-not $sig.TimeStamperCertificate) {
            throw "Signature is not timestamped; it must stay verifiable after the certificate expires."
          }
          if ($sig.Status -ne 'Valid') {
            throw "Signature status is '$($sig.Status)' - refusing to publish an unverified binary."
          }
          Write-Host "Signature verified against a trusted root."

      - name: Note an unsigned build
        if: steps.sign.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host "::warning title=Unsigned build::This artifact is unsigned: either no SSL.com eSigner secrets are configured, or this event is a pull request (which is never signed). SmartScreen will warn about it."

      - name: Compute SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist\Cleaner-Tool.exe").Hash.ToLower()
          "$hash  Cleaner-Tool.exe" | Out-File -Encoding ascii "dist\Cleaner-Tool.exe.sha256"
          Write-Host "SHA256: $hash"

      - name: Upload build artifact (raw .exe, no zip)
        uses: actions/upload-artifact@v4
        with:
          name: Cleaner-Tool-windows-exe
          path: |
            dist/Cleaner-Tool.exe
            dist/Cleaner-Tool.exe.sha256
          if-no-files-found: error

      # Only on pushes to main - PRs from forks can't write releases, and a
      # feature branch should not clobber "latest".
      - name: Update rolling latest release (overwrite every build)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Rolling build of Cleaner-Tool.exe from the latest `main` commit.

            - Commit: ${{ github.sha }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download `Cleaner-Tool.exe` below (raw .exe, not zipped). This
            asset is overwritten on every push to `main`. Verify it against
            `Cleaner-Tool.exe.sha256`.
          files: |
            dist/Cleaner-Tool.exe
            dist/Cleaner-Tool.exe.sha256
          make_latest: "true"
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Cleaner-Tool.exe
            dist/Cleaner-Tool.exe.sha256
          generate_release_notes: true
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
