name: Build Windows Executable

# Build a standalone .exe on every push to main / PR / manual run, and
# continuously overwrite a rolling "latest" release with the raw .exe
# (no zip). Version tags (e.g. v2.0.0) still create their own release too.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build .exe
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        # audit fix: the build never ran any test — regressions (like the
        # ToggleSwitch duplicate-def bug) shipped silently. The harness
        # checks run headless-safe; Tk is present on windows-latest runners.
        run: python -X utf8 -m tools.smoke_gui

      - name: Build with PyInstaller
        # --onefile  : single portable .exe
        # --windowed : no console window behind the GUI
        # --manifest : embed requireAdministrator manifest — Windows shows
        #              UAC on every launch and the app starts elevated, so
        #              the in-app Admin Gate / restart handshake is skipped
        # --icon / --add-data : bundle colored 🧼 icon from app/assets
        run: >
          pyinstaller --onefile --windowed
          --name "Cleaner-Tool"
          --icon "app/assets/icon.ico"
          --add-data "app/assets;app/assets"
          --manifest "app/assets/app_manifest.xml"
          app/__main__.py

      - name: Upload build artifact (raw .exe, no zip)
        uses: actions/upload-artifact@v4
        with:
          name: Cleaner-Tool-windows-exe
          path: dist/Cleaner-Tool.exe
          if-no-files-found: error

      - name: Update rolling latest release (overwrite every build)
        # Only on pushes to main — PRs from forks can't write releases,
        # and we don't want feature branches clobbering "latest".
        # This creates/overwrites the `latest` tag and replaces the
        # attached Cleaner-Tool.exe with the freshly built one.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Rolling build of Cleaner-Tool.exe from the latest `main` commit.

            - Commit: ${{ github.sha }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download `Cleaner-Tool.exe` below (raw .exe, not zipped). This asset is overwritten on every push to `main`.
          files: dist/Cleaner-Tool.exe
          make_latest: "true"
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Cleaner-Tool.exe
          generate_release_notes: true
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
