name: Build Windows Executable

# Build a standalone .exe on every push/PR to main, on demand, and produce a
# GitHub Release automatically when you push a version tag (e.g. v2.0.0).
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build .exe
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        # audit fix: the build never ran any test — regressions (like the
        # ToggleSwitch duplicate-def bug) shipped silently. The harness
        # checks run headless-safe; Tk is present on windows-latest runners.
        run: python -X utf8 -m tools.smoke_gui

      - name: Build with PyInstaller
        # --onefile  : single portable .exe
        # --windowed : no console window behind the GUI
        # --manifest : embed asInvoker manifest — the app asks for elevation
        #              itself via the Admin Gate screen (opt-in UAC), so the
        #              exe must NOT force a UAC prompt on every launch
        # --icon / --add-data : bundle colored 🧼 icon from app/assets
        run: >
          pyinstaller --onefile --windowed
          --name "CleanerTool"
          --icon "app/assets/icon.ico"
          --add-data "app/assets;app/assets"
          --manifest "app/assets/app_manifest.xml"
          app/__main__.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanerTool-windows-exe
          path: dist/CleanerTool.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CleanerTool.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
